<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoogis Textanalyse-Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,700;1,7..72,400&family=Pixelify+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#d6dfea; --wall:#c3d0df; --panel:#ffffff; --ink:#1f2540; --muted:#55607e; --line:#b6c3d6;
  --btn:#2a3263; --btn-ink:#ffffff; --btn-edge:#151a3a;
  --memo:#ffd76a; --memo-ink:#3b2f00; --red:#c93a4c; --green:#227a52; --okbg:#d9f6e6; --badbg:#fde0e4;
  --paper:#fcfdfe; --paper-ink:#1b2033; --hl:#fff1a8; --sel:#bfe3ff; --dim:#8b93ad;
  --pixel:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
  --ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --read:"Literata",Georgia,"Times New Roman",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141a34; --wall:#1b2347; --panel:#222a52; --ink:#eef1fb; --muted:#aab3d3; --line:#3a4677;
    --btn:#4b59ad; --btn-ink:#ffffff; --btn-edge:#0c1029;
    --okbg:#1f4a37; --badbg:#5a2430; --green:#7ee0ab; --red:#ff8d9b;
    --paper:#1c2244; --paper-ink:#e9ecf7; --hl:#6b5a14; --sel:#2a5a86; --dim:#7d86a6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141a34; --wall:#1b2347; --panel:#222a52; --ink:#eef1fb; --muted:#aab3d3; --line:#3a4677;
  --btn:#4b59ad; --btn-ink:#ffffff; --btn-edge:#0c1029;
  --okbg:#1f4a37; --badbg:#5a2430; --green:#7ee0ab; --red:#ff8d9b;
  --paper:#1c2244; --paper-ink:#e9ecf7; --hl:#6b5a14; --sel:#2a5a86; --dim:#7d86a6;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.5;
  -webkit-text-size-adjust:100%;touch-action:manipulation;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
img.px{image-rendering:pixelated;image-rendering:crisp-edges}
h1,h2,h3{font-family:var(--pixel);font-weight:600;line-height:1.2;margin:0 0 .5em}
p{margin:0 0 .7em}
.wrap{max-width:1180px;margin:0 auto;padding:16px clamp(12px,3vw,28px) 40px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- buttons ---------- */
.btn{font-family:var(--pixel);font-size:17px;min-height:48px;padding:10px 18px;border:3px solid var(--btn-edge);border-radius:4px;
  background:var(--btn);color:var(--btn-ink);box-shadow:0 4px 0 var(--btn-edge);transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-edge)}
.btn.memo{background:var(--memo);color:var(--memo-ink)}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--line);box-shadow:0 3px 0 var(--line)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.small{font-size:15px;min-height:44px;padding:6px 12px}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.seg:focus-visible,.tile:focus-visible{outline:3px solid var(--memo);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- title ---------- */
.title{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:
  linear-gradient(var(--wall),var(--wall)) bottom/100% 34% no-repeat, var(--bg)}
.title-card{display:grid;grid-template-columns:auto 1fr;gap:clamp(16px,4vw,48px);align-items:end;max-width:980px;width:100%}
.title-card .stage{display:flex;flex-direction:column;align-items:center;gap:0}
.hoogi-big{width:clamp(150px,24vw,230px);height:auto}
.typer{width:clamp(110px,17vw,160px);height:auto;margin-top:-8px}
.logo{font-family:var(--pixel);font-size:clamp(38px,7vw,78px);line-height:1;margin:0 0 .25em;letter-spacing:.01em;
  text-shadow:4px 4px 0 var(--memo)}
.logo small{display:block;font-size:.42em;letter-spacing:0;color:var(--muted);text-shadow:none;margin-top:.45em}
.intro{max-width:56ch;font-size:18px}
.bubble{position:relative;background:var(--panel);border:3px solid var(--btn-edge);border-radius:4px;padding:10px 14px;font-size:16px;max-width:30ch;margin-bottom:10px;box-shadow:4px 4px 0 var(--line)}
.bubble::after{content:"";position:absolute;left:28px;bottom:-12px;border:9px solid transparent;border-top-color:var(--btn-edge);border-bottom:0}
.note{font-size:14px;color:var(--muted)}
@media (max-width:640px){.title-card{grid-template-columns:1fr;justify-items:center;text-align:center}.bubble::after{left:50%}}

/* ---------- map ---------- */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
.top h1{font-size:clamp(24px,3.4vw,34px);margin:0}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:4px 10px;font-size:15px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.reco{display:flex;gap:12px;align-items:center;background:var(--panel);border:3px solid var(--btn-edge);border-radius:4px;padding:10px 14px;margin-bottom:18px;box-shadow:4px 4px 0 var(--line)}
.reco img{width:56px;height:auto;flex:none}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;counter-reset:st}
@media (max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
.tile{position:relative;text-align:left;background:var(--panel);border:3px solid var(--line);border-radius:4px;padding:14px 14px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;min-height:132px}
.tile .ic{width:40px;height:40px;grid-row:1/4}
.tile .no{font-family:var(--pixel);font-size:14px;color:var(--muted)}
.tile .h3{font-family:var(--pixel);font-weight:600;font-size:19px;line-height:1.2}
.tile .ds{font-size:14.5px;color:var(--muted);grid-column:1/-1;margin-top:4px}
.tile .st{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:14px}
.tile.rec{border-color:var(--btn-edge);box-shadow:4px 4px 0 var(--memo)}
.pill{display:inline-block;border-radius:3px;padding:1px 8px;font-size:13px;font-weight:700;border:2px solid var(--line)}
.pill.neu{color:var(--muted)} .pill.beg{background:var(--hl)} .pill.abg{background:var(--sel)} .pill.gem{background:var(--okbg);border-color:var(--green)}
.sect{font-family:var(--pixel);font-size:18px;margin:26px 0 10px;color:var(--muted)}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:620px){.grid.two{grid-template-columns:1fr}}
.tile.special{border-style:dashed}

/* ---------- runner ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:8px clamp(10px,2.5vw,24px);border-bottom:3px solid var(--line)}
.bar .t{flex:1;min-width:0}
.bar .t b{font-family:var(--pixel);font-weight:600;font-size:18px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.dot{width:12px;height:8px;background:var(--line)} .dot.ok{background:var(--green)} .dot.bad{background:var(--red)} .dot.cur{background:var(--memo);outline:2px solid var(--btn-edge)}
.work{display:grid;gap:18px;padding:16px clamp(10px,2.5vw,24px) 40px;max-width:1280px;margin:0 auto}
.work.split{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}
.work.split .paper{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
@media (max-width:899px),(orientation:portrait){.work.split{grid-template-columns:1fr}.work.split .paper{position:static;max-height:none}}
.paper{background:var(--paper);color:var(--paper-ink);border:2px solid var(--line);border-radius:4px;padding:16px 18px 18px;font-family:var(--read);font-size:17.5px;line-height:1.7}
.fikt{display:inline-block;font-family:var(--ui);font-size:12.5px;font-weight:700;background:var(--memo);color:var(--memo-ink);padding:1px 8px;border-radius:2px;margin-bottom:8px}
.head{font-family:var(--ui);font-size:14.5px;line-height:1.45;border-left:4px solid var(--btn);padding:4px 0 4px 10px;margin-bottom:12px;color:var(--paper-ink)}
.head .ti{font-family:var(--read);font-size:19px;font-weight:700;display:block;margin-bottom:2px}
.para{display:grid;grid-template-columns:3.2em 1fr;gap:4px;margin:0 0 .65em}
.para .pn{font-family:var(--ui);font-size:12.5px;color:var(--dim);padding-top:.35em}
.seg{border-radius:2px;padding:1px 0;transition:background .1s}
.seg.can{background:linear-gradient(transparent 62%,var(--hl) 62%);cursor:pointer}
.seg.on{background:var(--sel);outline:2px solid var(--btn)}
.seg.okm{background:var(--okbg)} .seg.badm{background:var(--badbg)}
.seg.dim{opacity:.55}
.bdg{display:inline-block;font-family:var(--ui);font-size:12px;font-weight:700;line-height:1.3;padding:0 6px;border-radius:2px;margin-left:4px;vertical-align:1px;color:#1f2540;border:1.5px solid rgba(0,0,0,.35)}
.full{margin-top:10px}
.task{background:var(--panel);border:3px solid var(--btn-edge);border-radius:4px;padding:16px clamp(12px,2vw,20px);box-shadow:5px 5px 0 var(--line)}
.task .q{font-size:18px;font-weight:700;margin-bottom:12px}
.star{font-family:var(--pixel);font-size:14px;background:var(--memo);color:var(--memo-ink);padding:0 6px;border-radius:2px;margin-right:6px}
.ctx{font-family:var(--read);background:var(--paper);color:var(--paper-ink);border-left:4px solid var(--memo);padding:8px 12px;margin:0 0 12px}
.opts{display:grid;gap:8px}
.opt{display:block;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:11px 14px;min-height:48px;font-size:16.5px;line-height:1.45}
.opt.on{border-color:var(--btn);background:var(--sel)}
.opt.ok{border-color:var(--green);background:var(--okbg)} .opt.bad{border-color:var(--red);background:var(--badbg)}
.opt .fbx{display:block;font-size:14.5px;margin-top:4px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:2px solid rgba(0,0,0,.4);border-radius:3px;padding:6px 10px;min-height:44px;font-size:15px;font-weight:700;color:#1f2540}
.chip.act{outline:3px solid var(--btn);outline-offset:2px;box-shadow:0 0 0 2px var(--panel)}
.items{display:grid;gap:8px}
.item{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:10px 12px;min-height:48px;font-size:16px}
.item .y{color:var(--muted);font-size:15px}
.item .y::before{content:"↳ ";}
.item.ok{border-color:var(--green);background:var(--okbg)} .item.bad{border-color:var(--red);background:var(--badbg)}
.item .nt{font-size:14.5px}
.hintline{font-size:14.5px;color:var(--muted);margin:-4px 0 10px}
.seq{min-height:56px;border:2px dashed var(--line);border-radius:4px;padding:8px;display:grid;gap:6px;margin-bottom:10px;counter-reset:sq}
.seq .opt{counter-increment:sq}
.seq .opt::before{content:counter(sq) ". ";font-weight:700}
.seq:empty::before{content:"Tippe die Bausteine unten in der richtigen Reihenfolge an.";color:var(--muted);font-size:15px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.match{grid-template-columns:1fr}}
.match .col{display:grid;gap:8px;align-content:start}
.opt .tag{display:inline-block;min-width:1.6em;text-align:center;font-weight:700;background:var(--memo);color:var(--memo-ink);border-radius:2px;margin-right:6px}
.cloze{font-family:var(--read);font-size:17.5px;line-height:2.1}
.gap{font-family:var(--ui);font-size:15.5px;border:2px solid var(--btn);background:var(--sel);color:var(--ink);border-radius:3px;padding:2px 8px;min-height:40px;line-height:1.35;text-align:left;vertical-align:baseline}
.gap.empty{background:var(--panel);border-style:dashed}
.gap.ok{border-color:var(--green);background:var(--okbg)} .gap.bad{border-color:var(--red);background:var(--badbg)}
.choices{margin:10px 0;padding:10px;border:2px solid var(--btn);border-radius:4px;background:var(--panel);display:grid;gap:6px}
.choices .lab{font-size:14px;color:var(--muted)}
.chunks{font-family:var(--read);font-size:18px;line-height:2}
.chunks.block{display:grid;gap:6px;line-height:1.5}
.ck{font:inherit;color:inherit;background:linear-gradient(transparent 62%,var(--hl) 62%);border:0;border-radius:2px;padding:2px 1px;text-align:left}
.chunks.block .ck{display:block;width:100%;border:2px solid var(--line);background:var(--panel);padding:8px 10px;border-radius:4px;font-family:var(--ui);font-size:16px}
.ck.on{background:var(--sel);outline:2px solid var(--btn)}
.ck.ok{background:var(--okbg);outline:2px solid var(--green)} .ck.bad{background:var(--badbg);outline:2px solid var(--red)}
.ck.plain{background:none;cursor:default}
.helps{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:2px dashed var(--line)}
.hint{margin-top:10px;background:var(--hl);color:var(--ink);padding:8px 12px;border-radius:3px;font-size:15.5px}
.acts{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
.fb{margin-top:14px;border:3px solid var(--green);background:var(--okbg);border-radius:4px;padding:10px 14px}
.fb.no{border-color:var(--red);background:var(--badbg)}
.fb h3{font-size:18px;margin:0 0 4px}
.fb p{margin:.3em 0}
.fb ul{margin:.3em 0;padding-left:1.2em}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,14,34,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.card{background:var(--panel);color:var(--ink);border:3px solid var(--btn-edge);border-radius:4px;box-shadow:6px 6px 0 var(--btn-edge);padding:18px 20px;max-width:640px;width:100%;max-height:calc(100vh - 32px);overflow:auto}
.card h2{font-size:22px}
.card .x{float:right}
.copybox{font-family:var(--ui);font-size:14px;white-space:pre-wrap;background:var(--paper);color:var(--paper-ink);border:2px solid var(--line);padding:10px;border-radius:3px;max-height:40vh;overflow:auto;user-select:all;-webkit-user-select:all}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:2px dashed var(--line)}
.sw{min-width:92px}
.gl-e{border:2px solid var(--line);border-radius:4px;margin-bottom:8px;background:var(--panel)}
.gl-e > button{width:100%;text-align:left;background:none;border:0;padding:10px 12px;font-weight:700;min-height:48px;display:flex;justify-content:space-between}
.gl-e .gb{padding:0 12px 12px;font-size:15.5px}
.gl-e .gb dt{font-weight:700;margin-top:6px} .gl-e .gb dd{margin:0}

/* ---------- results / overview ---------- */
.res-head{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.res-head img{width:84px;height:auto}
.big{font-family:var(--pixel);font-size:40px;line-height:1}
.refl{margin-top:18px}
.refl h3{font-size:17px;margin-top:14px}
.tg{border:2px solid var(--line);background:var(--panel);border-radius:3px;padding:6px 10px;min-height:44px;font-size:15px}
.tg.on{background:var(--sel);border-color:var(--btn);font-weight:700}
.ovw{display:grid;gap:10px}
.ovr{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:10px 12px}
@media (max-width:600px){.ovr{grid-template-columns:1fr}}
.meter{height:14px;background:var(--line);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--green)}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.badge{display:flex;gap:8px;align-items:center;border:2px solid var(--line);border-radius:4px;padding:6px 10px;background:var(--panel);font-size:15px}
.badge.lock{opacity:.45}
.badge img{width:28px;height:28px}
.dossier{background:var(--paper);color:var(--paper-ink);border:2px solid var(--line);border-radius:4px;padding:16px 18px;font-size:16px}
.dossier h3{font-family:var(--pixel);font-size:18px;margin:14px 0 4px}
.dossier h3:first-child{margin-top:0}
.dossier p{margin:.2em 0 .6em}
.bob{animation:bob 1.6s steps(4) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.pop{animation:pop .25s steps(3)}
@keyframes pop{0%{transform:scale(.92)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.bob,.pop{animation:none}}
.reduce .bob,.reduce .pop{animation:none}
.item .bdg{align-self:flex-start;margin-left:0}
</style></head><body>
<main id="app"></main><div id="ovs"></div>

   "Diese Sorge ist verständlich, aber sie greift zu kurz."],
  ["Jugendliche sind keine wehrlosen Opfer ihrer Bildschirme.",
   "Schon der Soziologe George Herbert Mead hat beschrieben, dass sich Identität im aktiven Austausch mit anderen entwickelt – und dazu gehören heute auch Vorbilder aus dem Netz.",
   "Viele junge Menschen vergleichen, prüfen und verwerfen das, was sie online sehen.",
   "Sie wählen aus, wem sie folgen, und entscheiden selbst, welche Vorbilder zu ihnen passen."],
  ["Natürlich gibt es problematische Inhalte, etwa unrealistische Schönheitsideale.",
   "Doch wer daraus schließt, man müsse Jugendlichen den Zugang verbieten, schüttet das Kind mit dem Bade aus."],
  ["In unseren Medienwerkstätten erleben wir jede Woche, wie Jugendliche eigene Videos drehen und dabei lernen, Inszenierungen zu durchschauen.",
   "Solche Angebote sind wirksamer als jedes Verbot, weil sie Kompetenzen aufbauen, statt Risiken nur zu verdrängen."],
  ["Wir fordern daher, Medienprojekte in der Jugendarbeit dauerhaft zu finanzieren.",
   "Wer Jugendliche ernst nimmt, traut ihnen etwas zu.",
   "Verbote dagegen vermitteln vor allem eines: Misstrauen."]
  ]},
T3: { titel: "Ein Ort, der euch gehört", autor: "Dr. Sabine Wolters", rolle: "Bürgermeisterin der Stadt Emscherfeld", medium: "Rede zur Eröffnung des Jugendzentrums „Bahnhof 7“", datum: "6. September 2025", sorte: "Rede",
  adressaten: "Jugendliche, Eltern, Gäste aus der Stadtgesellschaft und die Presse", thema: "Eröffnung eines Jugendzentrums und die Bedeutung eigener Räume für Jugendliche", unterthema: "Sozialisationsinstanzen und Peergroup", stufe: 1,
  these: "Jugendliche brauchen eigene Räume jenseits von Familie und Schule; die Stadt hat mit dem Jugendzentrum richtig gehandelt.",
  intention: "Die Rednerin will die Jugendlichen motivieren, das Zentrum zu nutzen, und zugleich ihre eigene Politik als erfolgreich darstellen.",
  paras: [
  ["Liebe Jugendliche, liebe Eltern, liebe Gäste!",
   "Heute ist ein guter Tag für Emscherfeld.",
   "Wir haben durchgesetzt, dass dieser alte Bahnhof wieder ein Ort für junge Menschen wird.",
   "Viele von euch haben dafür Ideen eingebracht, Pläne gezeichnet und mit angepackt."],
  ["Warum ist das so wichtig?",
   "Familie und Schule prägen euch, aber sie sind nicht die einzigen Orte, an denen ihr herausfindet, wer ihr seid.",
   "Hier, unter Gleichaltrigen, könnt ihr Rollen ausprobieren, ohne dass gleich eine Note oder ein Elternteil danebensteht.",
   "Ihr könnt hier Musik machen, Projekte planen oder einfach zusammensitzen."],
  ["Manche im Stadtrat haben gezögert und monatelang kein Konzept vorgelegt.",
   "Wir dagegen haben gehandelt.",
   "Jeder Euro, den wir in Jugendarbeit stecken, spart später ein Vielfaches an Folgekosten – das zeigen die Erfahrungen vieler Städte.",
   "Das Geld ist also gut angelegt."],
  ["Dieser Ort gehört euch.",
   "Macht etwas daraus – gestaltet ihn mit, streitet, lacht und lernt voneinander!",
   "Denn eine Stadt, die ihrer Jugend Raum gibt, gibt sich selbst eine Zukunft."]
  ]},
T4: { titel: "Gefährliche Klicks", autor: "Tobias Reinert", rolle: "Redakteur", medium: "Westfalen-Echo online", datum: "22. Oktober 2025", sorte: "Kommentar",
  adressaten: "Leserinnen und Leser, insbesondere Eltern, sowie Politik und Plattformbetreiber", thema: "Gefährliche Mutproben in sozialen Netzwerken und Gruppendruck", unterthema: "Verhalten von Individuen in Gruppen", stufe: 2,
  these: "Soziale Netzwerke sind zu einem Gift für Kinder geworden; gefährliche Challenges müssen per Gesetz schnell gelöscht werden.",
  intention: "Der Autor will alarmieren und Druck auf Politik und Plattformbetreiber ausüben, eine Löschpflicht einzuführen.",
  paras: [
  ["Ein 14-Jähriger landet im Krankenhaus, weil er eine Mutprobe aus dem Netz nachgemacht hat.",
   "Es ist nur ein Fall von vielen – und er zeigt: Die sozialen Netzwerke sind zu einem Gift für unsere Kinder geworden.",
   "Eltern erfahren davon meist erst, wenn es zu spät ist."],
  ["Gruppendruck hat es immer gegeben.",
   "Doch früher sahen fünf Freunde zu, heute sind es fünftausend Fremde.",
   "Wer nicht mitmacht, gilt schnell als Feigling – und wer mitmacht, bekommt Likes.",
   "So entsteht ein Wettbewerb um die gefährlichste Mutprobe."],
  ["Die Plattformbetreiber verdienen an jedem Klick und schauen tatenlos zu.",
   "Sie stehen auf der falschen Seite einer Front, an der unsere Kinder die Opfer sind.",
   "Ihre Algorithmen belohnen Aufmerksamkeit – egal, um welchen Preis."],
  ["Es gibt nur einen Weg: Gefährliche Challenges müssen innerhalb von 24 Stunden gelöscht werden, sonst drohen empfindliche Strafen.",
   "Wenn wir jetzt nicht handeln, verlieren wir eine ganze Generation.",
   "Die Politik muss endlich Verantwortung übernehmen."]
  ]},
T5: { titel: "Das Zauberwort Teamfähigkeit", autor: "Dr. Nele Hoffmann", rolle: "Wirtschaftsredakteurin", medium: "Ruhrtal-Kurier", datum: "9. Mai 2026", sorte: "Kommentar",
  adressaten: "Leserinnen und Leser, insbesondere Arbeitgeber und Berufseinsteigerinnen und -einsteiger", thema: "Die Anforderung „Teamfähigkeit“ in Stellenanzeigen", unterthema: "Rollenerwartungen und Gruppennormen in der Arbeitswelt", stufe: 2,
  these: "Hinter der Forderung nach Teamfähigkeit verbirgt sich oft eine unausgesprochene Erwartung an Anpassung.",
  intention: "Die Autorin will zum Nachdenken über den Begriff anregen und Unternehmen dazu bewegen, ihre Erwartungen offenzulegen und Widerspruch zuzulassen.",
  paras: [
  ["Kaum eine Stellenanzeige kommt heute ohne das Wort „Teamfähigkeit“ aus.",
   "Doch hinter dem freundlich klingenden Begriff verbirgt sich oft eine Erwartung, über die selten offen gesprochen wird: Passe dich an."],
  ["Gruppen entwickeln eigene Normen, und wer davon abweicht, muss mit Sanktionen rechnen – vom Augenrollen bis zum Ausschluss.",
   "Der Soziologe Ralf Dahrendorf hat Rollenerwartungen nach ihrer Verbindlichkeit in Muss-, Soll- und Kann-Erwartungen unterschieden.",
   "Teamfähigkeit wird in vielen Betrieben stillschweigend wie eine Muss-Erwartung behandelt, obwohl niemand genau sagt, was dazugehört."],
  ["Ein Beispiel: Eine Auszubildende weist im Teammeeting auf einen Fehler im Arbeitsablauf hin – und gilt danach als „schwierig“.",
   "Ist das Teamfähigkeit, wenn kritische Hinweise als Störung gelten?"],
  ["Natürlich brauchen Unternehmen Menschen, die zusammenarbeiten können.",
   "Gute Zusammenarbeit beruht aber darauf, dass unterschiedliche Sichtweisen eingebracht werden dürfen – das macht Teams nachweislich leistungsfähiger."],
  ["Unternehmen sollten deshalb in ihren Anzeigen konkret beschreiben, was sie unter Teamfähigkeit verstehen.",
   "Und sie sollten Widerspruch nicht als Mangel an Teamgeist abtun, sondern als Beitrag zum gemeinsamen Erfolg verstehen."]
  ]},
T6: { titel: "Rollenbilder beginnen im Kinderzimmer", autor: "Mira Petersen", rolle: "Sprecherin der Initiative „Spielzeug für alle“", medium: "Website der Initiative", datum: "1. März 2026", sorte: "Stellungnahme",
  adressaten: "Spielwarenhandel, Eltern und die interessierte Öffentlichkeit", thema: "Geschlechterstereotype bei Kinderspielzeug", unterthema: "Geschlechterrollen und Sozialisation", stufe: 2,
  these: "Die Einteilung von Spielzeug nach Geschlecht prägt Kinder früh in einschränkende Rollen.",
  intention: "Die Initiative will den Handel dazu bewegen, Spielzeug nach Themen statt nach Geschlecht zu sortieren.",
  paras: [
  ["Rosa Regale für Mädchen, blaue für Jungen: Wer heute durch einen Spielwarenladen geht, könnte meinen, die Zeit sei stehen geblieben.",
   "Diese Einteilung ist kein harmloser Spaß, sondern prägt Kinder früh in Rollen, die ihre Zukunft einschränken."],
  ["Kinder lernen durch Nachahmung und durch die Reaktionen ihrer Umwelt, was als „typisch“ für ihr Geschlecht gilt.",
   "Wer als Mädchen nur Puppenküchen geschenkt bekommt, entwickelt seltener Interesse an Technik – das hat das Institut für Kindheitsforschung Emscherfeld in einer Langzeitstudie gezeigt."],
  ["Manche halten dagegen, Kinder suchten sich ihr Spielzeug doch selbst aus.",
   "Doch freie Wahl setzt voraus, dass alle Möglichkeiten gleich sichtbar sind – und genau das ist im Laden nicht der Fall."],
  ["Das Grundgesetz verpflichtet den Staat, die tatsächliche Gleichberechtigung von Frauen und Männern zu fördern.",
   "Dieser Auftrag endet nicht an der Ladentür."],
  ["Wir fordern den Handel auf, Spielzeug nach Themen statt nach Geschlecht zu sortieren.",
   "Das kostet nichts – und öffnet Kindern Türen, die ihnen bisher verschlossen bleiben."]
  ]},

T7: { titel: "Pflicht ist kein Ehrenamt", autor: "Laura Steinbach", rolle: "Redakteurin", medium: "Emscherfelder Zeitung", datum: "12. März 2026", sorte: "Kommentar",
  adressaten: "Leserinnen und Leser, insbesondere junge Erwachsene und Politik", thema: "Ein verpflichtender Gesellschaftsdienst für junge Erwachsene", unterthema: "Werte, Normen und Zukunftsentwürfe", stufe: 1,
  these: "Ein verpflichtender Gesellschaftsdienst ist der falsche Weg; freiwillige Dienste sollten besser gefördert werden.",
  intention: "Die Autorin will die Leserschaft gegen eine Dienstpflicht einnehmen und die Politik zur Förderung freiwilliger Dienste bewegen.",
  paras: [
  ["Seit Monaten wird über einen verpflichtenden Gesellschaftsdienst für alle jungen Erwachsenen diskutiert.",
   "Befürworter versprechen sich davon mehr Zusammenhalt zwischen den Generationen.",
   "Ein solcher Dienst würde je nach Modell sechs bis zwölf Monate dauern."],
  ["Ich halte eine solche Pflicht für den falschen Weg.",
   "Engagement lebt davon, dass Menschen sich aus eigenem Antrieb für andere einsetzen.",
   "Eine Pflicht würde aus Hilfsbereitschaft eine lästige Aufgabe machen, die man möglichst schnell hinter sich bringt."],
  ["Nach Angaben der Freiwilligenagentur Emscherfeld blieben im vergangenen Jahr rund 300 Plätze im Freiwilligen Sozialen Jahr unbesetzt, weil das Taschengeld kaum zum Leben reichte.",
   "Das Problem ist also nicht fehlende Bereitschaft, sondern fehlende Unterstützung."],
  ["Wie es anders gehen kann, zeigt eine Pflegeeinrichtung in unserer Stadt: Seit sie Freiwilligen ein Monatsticket und eine Unterkunft stellt, sind alle Plätze belegt.",
   "Die Einrichtung finanziert das aus Spenden."],
  ["Die Politik sollte deshalb zuerst die freiwilligen Dienste attraktiver machen.",
   "Wer junge Menschen zu Engagement verpflichtet, verwechselt Zusammenhalt mit Gehorsam."]
  ]},
T8: { titel: "Kleidung ist Teil von uns", autor: "Hannah Brück", rolle: "Schülersprecherin des Kanal-Gymnasiums Emscherfeld", medium: "Rede in der Schulkonferenz des Kanal-Gymnasiums", datum: "20. Januar 2026", sorte: "Rede",
  adressaten: "Mitglieder der Schulkonferenz (Lehrkräfte, Eltern, Schülerinnen und Schüler)", thema: "Eine geplante Kleiderordnung an der Schule", unterthema: "Normen, Sanktionen und Identitätsdarstellung", stufe: 1,
  these: "Die Schülervertretung lehnt die geplante Kleiderordnung in ihrer jetzigen Form ab.",
  intention: "Die Rednerin will die Schulkonferenz davon überzeugen, die Kleiderordnung abzulehnen und Regeln gemeinsam zu erarbeiten.",
  paras: [
  ["Sehr geehrte Mitglieder der Schulkonferenz!",
   "Die Schulleitung schlägt vor, eine Kleiderordnung einzuführen, die bauchfreie Oberteile, Jogginghosen und Kappen im Unterricht verbietet."],
  ["Im Namen der Schülervertretung lehne ich diesen Vorschlag in seiner jetzigen Form ab.",
   "Kleidung ist für viele Jugendliche ein Teil ihrer Identität: Sie zeigen damit, zu welcher Gruppe sie gehören und wer sie sein wollen.",
   "Wer ihnen vorschreibt, was sie tragen dürfen, greift in diese Selbstdarstellung ein."],
  ["In einer Umfrage der Schülervertretung haben sich 412 von 560 Schülerinnen und Schülern gegen die geplante Regel ausgesprochen.",
   "Eine Regel, die so wenig Rückhalt hat, wird im Alltag kaum beachtet werden."],
  ["An einer Nachbarschule wurde vor zwei Jahren eine ähnliche Ordnung eingeführt; seitdem streiten Lehrkräfte und Schüler dort regelmäßig darüber, ob ein Kleidungsstück noch erlaubt ist."],
  ["Wir schlagen stattdessen vor, gemeinsam Regeln zu erarbeiten, die alle Gruppen der Schule mittragen.",
   "Nur so entsteht eine Ordnung, die nicht von oben verordnet, sondern von allen gelebt wird."]
  ]},
T9: { titel: "Der Esstisch als Klassenzimmer", autor: "Ben Albers", rolle: "Redakteur", medium: "Westfalen-Echo", datum: "5. Februar 2026", sorte: "Kommentar",
  adressaten: "Leserinnen und Leser, insbesondere Eltern und Arbeitgeber", thema: "Gemeinsame Mahlzeiten in der Familie", unterthema: "Familie als primäre Sozialisationsinstanz", stufe: 2,
  these: "Der gemeinsame Familientisch ist ein zentraler Ort der Sozialisation und sollte bewusst gepflegt werden.",
  intention: "Der Autor will Eltern zu festen gemeinsamen Mahlzeiten ermutigen und Arbeitgeber zu verlässlichen Arbeitszeiten bewegen.",
  paras: [
  ["In vielen Familien ist das gemeinsame Abendessen selten geworden.",
   "Eltern arbeiten im Schichtdienst, Kinder haben Training oder sitzen mit dem Teller vor dem Bildschirm.",
   "Termine und Arbeitszeiten passen oft schlicht nicht zusammen."],
  ["Dabei ist der Familientisch einer der wichtigsten Orte, an denen Kinder lernen, wie man miteinander umgeht.",
   "Hier wird erzählt, gestritten und zugehört – hier werden Werte und Regeln weitergegeben, oft ganz nebenbei."],
  ["Die Soziologie bezeichnet die Familie als primäre Sozialisationsinstanz, weil sie Kinder als erste und besonders nachhaltig prägt.",
   "Eine Langzeitstudie der Universität Emscherfeld kam zu dem Ergebnis, dass Jugendliche, die regelmäßig mit ihren Eltern essen, häufiger angeben, mit ihnen über Probleme zu sprechen."],
  ["Natürlich kann nicht jede Familie jeden Abend gemeinsam essen.",
   "Doch schon zwei feste Mahlzeiten pro Woche können einen Unterschied machen."],
  ["Arbeitgeber sollten Eltern deshalb verlässliche Arbeitszeiten ermöglichen.",
   "Familienzeit ist keine Privatsache, sondern eine Investition in die nächste Generation."]
  ]},
T10: { titel: "Sport verbindet – aber nicht umsonst", autor: "Stefan Kühne", rolle: "Präsident des Stadtsportbundes Emscherfeld e. V.", medium: "Website des Stadtsportbundes (Pressemitteilung)", datum: "14. April 2026", sorte: "Stellungnahme",
  adressaten: "Stadtrat, Vereinsmitglieder und Öffentlichkeit", thema: "Geplante Gebühren für die Nutzung städtischer Sporthallen", unterthema: "Sportverein als Sozialisationsinstanz", stufe: 1,
  these: "Der Stadtsportbund lehnt Hallengebühren für gemeinnützige Vereine ab.",
  intention: "Der Verband will den Stadtrat dazu bringen, auf die Gebühren zu verzichten; dabei vertritt er die finanziellen Interessen seiner Vereine.",
  paras: [
  ["Der Stadtrat will ab dem kommenden Jahr Gebühren für die Nutzung städtischer Sporthallen erheben.",
   "Nach unseren Berechnungen kämen auf einen mittelgroßen Verein so jährlich rund 8 000 Euro zu.",
   "Bislang können gemeinnützige Vereine die Hallen kostenlos nutzen."],
  ["Der Stadtsportbund lehnt diese Pläne entschieden ab.",
   "In unseren 64 Mitgliedsvereinen trainieren mehr als 9 000 Kinder und Jugendliche.",
   "Dort lernen sie nicht nur Sport, sondern auch, Regeln einzuhalten, fair zu verlieren und im Team Verantwortung zu übernehmen."],
  ["Wenn die Vereine die Gebühren an ihre Mitglieder weitergeben müssen, werden zuerst Kinder aus Familien mit wenig Geld aufhören.",
   "Gerade sie brauchen solche Orte aber besonders.",
   "Schon heute kann sich nicht jede Familie die Vereinsbeiträge leisten."],
  ["Die Stadt spart an der falschen Stelle.",
   "Wir fordern den Stadtrat auf, die Hallen für gemeinnützige Vereine weiterhin kostenfrei zur Verfügung zu stellen.",
   "Jeder Euro, der hier gespart wird, fehlt später an anderer Stelle."]
  ]},
T11: { titel: "Lasst sie ausprobieren", autor: "Dr. Jana Wilke", rolle: "Bildungsredakteurin", medium: "Ruhrtal-Kurier", datum: "28. Februar 2026", sorte: "Kommentar",
  adressaten: "Leserinnen und Leser, insbesondere Eltern, Jugendliche und Schulen", thema: "Berufswahl Jugendlicher und der Druck, sich früh festzulegen", unterthema: "Individuelle Zukunftsentwürfe", stufe: 2,
  these: "Jugendliche brauchen Zeit und Gelegenheiten, verschiedene Tätigkeiten auszuprobieren, bevor sie sich auf einen Beruf festlegen.",
  intention: "Die Autorin will den Druck auf Jugendliche verringern und Schulen zu mehr Praktika bewegen.",
  paras: [
  ["„Und, was willst du später mal werden?“ – kaum eine Frage hören Jugendliche häufiger.",
   "Viele haben darauf mit 16 noch keine Antwort, und das ist völlig in Ordnung."],
  ["Der Druck, sich früh festzulegen, ist trotzdem groß.",
   "Eltern wünschen sich einen sicheren Beruf, Freunde wählen Studiengänge, die gerade gefragt sind, und in sozialen Medien werden Traumjobs vorgeführt.",
   "Hinzu kommt die Sorge, ohne klaren Plan den Anschluss zu verpassen."],
  ["Laut einer Erhebung der Industrie- und Handelskammer Emscherland wird in der Region rund jeder vierte Ausbildungsvertrag vorzeitig gelöst.",
   "Wer sich zu früh und unter Druck entscheidet, landet eher in einem Beruf, der nicht zu ihm passt.",
   "So jedenfalls lässt sich die hohe Zahl der Abbrüche zumindest teilweise erklären."],
  ["Jugendliche brauchen deshalb Gelegenheiten, verschiedene Tätigkeiten kennenzulernen, bevor sie sich festlegen.",
   "Schulen sollten mindestens zwei Praktika in unterschiedlichen Berufsfeldern ermöglichen.",
   "Ein Umweg ist kein Scheitern, sondern Teil der Suche nach dem eigenen Weg."]
  ]},
T12: { titel: "Mut zur eigenen Stimme", autor: "Dr. Petra Lange", rolle: "Schulleiterin des Kanal-Gymnasiums Emscherfeld", medium: "Rede zur Begrüßung der neuen Einführungsphase", datum: "19. August 2026", sorte: "Rede",
  adressaten: "Die neuen Schülerinnen und Schüler der Einführungsphase", thema: "Zugehörigkeit zu Gruppen und Anpassungsdruck in der Oberstufe", unterthema: "Verhalten von Individuen in Gruppen", stufe: 1,
  these: "Die Schülerinnen und Schüler sollen sich in Gruppen einbringen, ohne die eigene Meinung aufzugeben.",
  intention: "Die Rednerin will die neuen Oberstufenschülerinnen und -schüler ermutigen, in Gruppen eigene Standpunkte zu vertreten.",
  paras: [
  ["Liebe Schülerinnen und Schüler der Einführungsphase, herzlich willkommen in der Oberstufe!",
   "Für viele von euch beginnt heute ein neuer Abschnitt: neue Kurse, neue Mitschülerinnen und Mitschüler, neue Gruppen.",
   "Ihr werdet euren Platz finden, und ihr werdet ihn mitgestalten."],
  ["Gruppen geben Halt.",
   "Wer dazugehört, fühlt sich sicher und wird unterstützt.",
   "Doch Gruppen erwarten auch, dass man sich ihren Regeln anpasst – manchmal mehr, als einem guttut."],
  ["Der Psychologe Solomon Asch zeigte schon in den 1950er-Jahren in Experimenten, dass viele Menschen einem offensichtlich falschen Urteil einer Gruppe zustimmen, um nicht aufzufallen.",
   "Anpassung ist also menschlich – aber sie hat ihren Preis.",
   "Wer sich immer nur anpasst, verliert irgendwann die eigene Stimme."],
  ["Ich wünsche mir, dass ihr in euren Gruppen mitmacht, ohne euch selbst zu verlieren.",
   "Sagt, was ihr denkt, auch wenn ihr damit allein dasteht.",
   "Wir werden in jedem Kurs regelmäßig Zeit für Austausch einplanen, damit alle Stimmen gehört werden."]
  ]},
T13: { titel: "Klassenchats brauchen Regeln", autor: "Paul Reiners", rolle: "Redakteur", medium: "Emscherfelder Zeitung", datum: "3. Juni 2026", sorte: "Kommentar",
  adressaten: "Leserinnen und Leser, insbesondere Schulen, Eltern und Jugendliche", thema: "Konflikte in Klassen-Gruppenchats", unterthema: "Gruppennormen und Konformität", stufe: 2,
  these: "Nicht der Klassenchat ist das Problem, sondern das Fehlen gemeinsamer Regeln.",
  intention: "Der Autor will Schulen dazu bewegen, mit ihren Klassen Chatregeln zu vereinbaren, statt Chats zu verbieten.",
  paras: [
  ["Kaum eine Klasse kommt heute ohne Gruppenchat aus.",
   "Dort werden Hausaufgaben verglichen, Termine abgesprochen – und manchmal auch Mitschülerinnen und Mitschüler bloßgestellt.",
   "Fast alle Schülerinnen und Schüler sind Mitglied in mindestens einem solchen Chat."],
  ["Das Problem ist nicht der Chat selbst, sondern das Fehlen klarer Regeln.",
   "In einer Gruppe, in der niemand widerspricht, wird ein gemeiner Kommentar schnell zur Normalität."],
  ["Manche Schulen reagieren darauf mit einem Verbot von Klassenchats.",
   "Doch die Chats verschwinden dadurch nicht, sie werden nur ohne Lehrkräfte und ohne Regeln weitergeführt.",
   "Wer dort ausgegrenzt wird, ist mit dem Problem allein."],
  ["An der Gesamtschule Emscherfeld-Nord hat jede Klasse im vergangenen Schuljahr eigene Chatregeln beschlossen; nach Angaben der Schulsozialarbeit ging die Zahl der gemeldeten Konflikte deutlich zurück."],
  ["Schulen sollten deshalb zu Beginn jedes Schuljahres mit ihren Klassen Chatregeln vereinbaren.",
   "Regeln, die man selbst aufstellt, hält man eher ein als Verbote, die andere erlassen."]
  ]},
T14: { titel: "Was Zeugnisse verschweigen", autor: "Claudia Rehm", rolle: "Geschäftsführerin des Unternehmerverbands Emscherland", medium: "Website des Unternehmerverbands", datum: "11. März 2026", sorte: "Stellungnahme",
  adressaten: "Öffentlichkeit, Schulen und Bildungspolitik", thema: "Aussagen von Schulzeugnissen über Arbeits- und Sozialverhalten", unterthema: "Werte, Normen und Rollenerwartungen der Arbeitswelt", stufe: 3,
  these: "Zeugnisse sollten wieder das Arbeits- und Sozialverhalten bewerten (implizit).",
  intention: "Der Verband will eine Bewertung von Arbeits- und Sozialverhalten auf Zeugnissen erreichen, die den Betrieben bei der Auswahl von Auszubildenden hilft.",
  paras: [
  ["Jedes Jahr bewerben sich bei unseren Mitgliedsbetrieben Tausende junge Menschen um einen Ausbildungsplatz.",
   "Die Zeugnisse verraten viel über ihre Leistungen in Mathematik und Deutsch – über Pünktlichkeit, Zuverlässigkeit und Teamarbeit verraten sie meist nichts.",
   "Für die Betriebe ist die Auswahl deshalb oft schwierig."],
  ["Dabei sind es genau diese Eigenschaften, nach denen Ausbilderinnen und Ausbilder in Gesprächen am häufigsten fragen.",
   "In einer Umfrage unseres Verbands nannten 71 Prozent der Betriebe mangelnde Zuverlässigkeit als häufigsten Grund für den Abbruch einer Ausbildung."],
  ["Früher standen solche Angaben als sogenannte Kopfnoten auf dem Zeugnis.",

const shuffledNot = a => { if (a.length < 2) return a.slice(); let b; let n = 0; do { b = shuffle(a); n++; } while (n < 20 && b.every((x, i) => x === a[i])); return b; };

let AC = null;
function beep(kind) {
  if (!S.settings.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const seq = kind === "ok" ? [[660, .07], [880, .1]] : kind === "bad" ? [[220, .14]] : kind === "win" ? [[523, .08], [659, .08], [784, .14]] : [[440, .04]];
    let t = AC.currentTime;
    seq.forEach(([f, d]) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = "square"; o.frequency.value = f; g.gain.setValueAtTime(.06, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d); t += d; });
  } catch (e) { }
}

const MISSION = id => MISSIONS.find(m => m.id === id);
const tasksOf = m => TASKS.filter(t => t.m === m);

function mStats(m) {
  const ts = tasksOf(m), done = ts.filter(t => S.res[t.id]), ok = done.filter(t => S.res[t.id].f);
  return { total: ts.length, done: done.length, ok: ok.length, rate: done.length ? ok.length / done.length : 0 };
}
function mStatus(m) {
  const s = mStats(m);
  if (!s.done) return "neu";
  if (s.done < s.total) return "begonnen";
  return s.ok / s.total >= .8 ? "gemeistert" : "abgeschlossen";
}
const STATUS_CLS = { neu: "neu", begonnen: "beg", abgeschlossen: "abg", gemeistert: "gem" };

    T.paras[n - 1].forEach((s, j) => {

      body.append(sp, document.createTextNode(" "));

  });
  if (paras && paras.length && paras.length < T.paras.length) {
    const fb = el("button", "btn ghost small full", "Ganzen Text lesen");

function record(t, ok, r) {

function missionOfLabel(lbl) { const t = TASKS.find(t => (t.type === "tag" && t.labels.includes(lbl)) || (t.opts && t.opts.some(o => o.cf && o.cf.includes(lbl)))); return t ? t.m : null; }
